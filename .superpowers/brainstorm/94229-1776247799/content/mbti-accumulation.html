<h2>MBTI 维度如何累积？</h2>
<p class="subtitle">题目里写的 "EI→E"、"EI→I" 是什么意思？</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>计数取多数（推荐）</h3>
      <p>每次 "EI→E" 就给 E 计一票，最终 E票 > I票 → 结果为 E<br>
      与第一版 MBTI 测试逻辑一致，实现简单</p>
      <p style="margin-top:8px;font-size:0.85em;opacity:0.7">平票时随机取一方（或默认取 I/N/F/P）</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>加权计数</h3>
      <p>不同题目对 MBTI 的权重不同（如主干题权重2，分支题权重1）<br>
      分支路线覆盖不均的问题可以通过权重补偿</p>
      <p style="margin-top:8px;font-size:0.85em;opacity:0.7">实现稍复杂，需要在题目数据里加 weight 字段</p>
    </div>
  </div>
</div>
